<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Done Samuel - Day 4</title>
    <style>
        body {
            background: #0f172a;
            color: #fbbf24;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            color: #fbbf24;
            font-size: 28px;
        }
        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        button {
            background: #22c55e;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Day 4: My Coding Journey</h1>
    <div class="card">
        <p><strong>Name:</strong> Done Samuel</p>
        <p><strong>Contact:</strong> 09016809988</p>
        <p><strong>Goal:</strong> get remote job</p>
        <p><strong>Started:</strong> May 9, 2026</p>
        
        <h2 id="counter" style="color: #22c55e; font-size: 36px;">Days Coded: 0</h2>
        <button onclick="addDay()">+ Add Day</button>
        <p id="status"></p>
    </div>

    <script>
    let days = localStorage.getItem('daysCoded');
    if (days === null) {
        days = 0;
    } else {
        days = parseInt(days);
    }
    updateDisplay();

    function addDay() {
        days = days + 1;
        localStorage.setItem('daysCoded', days);
        updateDisplay();
        document.getElementById('status').innerHTML = 'Day ' + days + ' locked in ✅ Keep going, Done Samuel!';
    }

    function updateDisplay() {
        document.getElementById('counter').innerHTML = 'Days Coded: ' + days;
    }
    </script>
</body>
</html>
